name: Verify and build standalone

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run tests
        run: npm test

      - name: Build standalone HTML
        run: npm run build

      - name: Verify standalone HTML
        run: npm run verify

      - name: Upload standalone preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rgb-hex-designer-preview
          path: index.html
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated standalone HTML
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- index.html && git ls-files --error-unmatch index.html >/dev/null 2>&1; then
            echo "Standalone HTML is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build: regenerate Pages index [skip ci]"
          git push
